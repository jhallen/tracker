<div class="editor" data-editor>
  <div class="toolbar" hidden>
    <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
    <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
    <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
    <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
    <button type="button" data-cmd="formatBlock" data-arg="h3" title="Heading">H</button>
    <button type="button" data-cmd="createLink" title="Link">Link</button>
    <button type="button" data-cmd="removeFormat" title="Clear formatting">⌫ Format</button>
  </div>
  <div class="editor-area" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="{{ editor_placeholder }}" hidden></div>
  <textarea name="{{ editor_name }}" rows="6" placeholder="{{ editor_placeholder }}">{{ editor_value }}</textarea>
</div>
