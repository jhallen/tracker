<!doctype html>
<html><body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1d2a1f; line-height: 1.5;">
<div style="max-width: 520px; margin: 0 auto; padding: 24px;">
  <h2 style="color: #2f6b3a; margin-top: 0;">Confirm your email address</h2>
  <p>Hello {{ name }},</p>
  <p>Please confirm that this is your email address for Greenhouse Maintenance.</p>
  <p style="margin: 28px 0;">
    <a href="{{ link }}" style="background: #2f6b3a; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">Verify my email</a>
  </p>
  <p style="font-size: 14px; color: #5f6f61;">Or paste this link into your browser:<br><a href="{{ link }}" style="color: #2f6b3a; word-break: break-all;">{{ link }}</a></p>
  <p style="font-size: 14px; color: #5f6f61;">The link works once and expires in {{ hours }} hours. If you did not sign up, you can ignore this message.</p>
</div>
</body></html>
