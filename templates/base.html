<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>{% block title %}Greenhouse Maintenance{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="28" height="28"><span>Greenhouse Maintenance</span></a>
  {% if let Some(n) = nav %}
  <nav class="mainnav">
    <a href="/">Dashboard</a>
    <a href="/issues">All requests</a>
    {% if n.is_admin %}<a href="/admin/users">Users</a>{% endif %}
    <a href="/profile" title="Your profile">{{ n.name }}</a>
    <form method="post" action="/logout" class="inline"><button class="linklike" type="submit">Log out</button></form>
  </nav>
  {% endif %}
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
{% block fab %}{% endblock %}
<script src="/static/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
